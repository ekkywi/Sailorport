services:
  postgres:
    image: postgres:16-alpine
    container_name: sailorport-postgres
    environment:
      POSTGRES_USER: sailorport
      POSTGRES_PASSWORD: sailorport
      POSTGRES_DB: sailorport
    ports:
      - "5433:5432"
    volumes:
      - sailorport_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sailorport -d sailorport"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build:
      context: ../../apps/api
    container_name: sailorport-api
    environment:
      PORT: "8080"
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://sailorport:sailorport@postgres:5432/sailorport?sslmode=disable
      SAILORPORT_WORKSPACE: /data/workspaces
      SAILORPORT_TEMPLATES: /templates
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?copy deploy/compose/.env.example to deploy/compose/.env and set AUTH_JWT_SECRET}
      SAILORPORT_AGENT_TOKEN: ${SAILORPORT_AGENT_TOKEN:?copy deploy/compose/.env.example to deploy/compose/.env and set SAILORPORT_AGENT_TOKEN}
      SAILORPORT_SECRETS_KEY: ${SAILORPORT_SECRETS_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - sailorport_workspaces:/data/workspaces
      - ../../templates:/templates:ro
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: ../../apps/web
    container_name: sailorport-web
    ports:
      - "5173:80"
    depends_on:
      - api
volumes:
  sailorport_pgdata:
  sailorport_workspaces:
